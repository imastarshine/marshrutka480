name: Publish original offline game to GitHub Pages

# Publication is explicitly started in Actions. Keep Pages on the original game.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare original offline game
        run: |
          mkdir _pages
          cp index.html _pages/
          cp -R js _pages/js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
