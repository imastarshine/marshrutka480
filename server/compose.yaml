services:
  game:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      M480_DATABASE: /app/server/data/marshrutka.sqlite3
      M480_PROXY_IPS: 172.29.48.1
    ports:
      - "${M480_BIND:-127.0.0.1}:${M480_PORT:-8000}:8000"
    volumes:
      - game-data:/app/server/data
    networks:
      - game-local
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  game-data:

networks:
  game-local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.48.0/24
          gateway: 172.29.48.1
